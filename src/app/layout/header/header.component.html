<header
  class="header fixed top-0 right-0 h-14 md:h-16 bg-dark-primary border-b border-dark-border z-40 flex items-center justify-between px-3 md:px-4 transition-all duration-300"
  [class.left-0]="isMobile" [style.left]="isMobile ? '0' : (isCollapsed ? '5rem' : '16rem')">

  <!-- Left -->
  <div class="flex items-center gap-2 md:gap-3">
    <button (click)="toggleSidebar()"
      class="p-2 rounded-lg bg-dark-secondary border border-dark-border text-dark-text hover-theme-text hover-theme-bg transition-all duration-200">
      <ion-icon name="menu-outline" class="text-xl"></ion-icon>
    </button>
    <h1 class="text-sm md:text-base font-semibold text-[rgb(var(--color-heading))] truncate max-w-[140px] sm:max-w-xs hidden sm:block">
      {{ currentTitle }}
    </h1>
  </div>

  <!-- Right -->
  <div class="flex items-center gap-1.5 sm:gap-2">

    <!-- Empresa (md+) -->
    <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-dark-secondary border border-dark-border cursor-pointer hover:border-brand-primary/40 transition-all duration-200">
      <ion-icon name="business-outline" class="text-brand-primary text-base flex-shrink-0"></ion-icon>
      <span class="text-xs font-medium text-[rgb(var(--color-heading))] max-w-[120px] truncate">{{ empresaName }}</span>
      <ion-icon name="chevron-down-outline" class="text-dark-text text-xs flex-shrink-0"></ion-icon>
    </div>

    <!-- Theme toggle -->
    <button
      class="hidden sm:flex p-2 rounded-lg text-dark-text hover-theme-text hover-theme-bg transition-all duration-200"
      (click)="toggleTheme()"
      [attr.aria-label]="currentTheme === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'">
      <ion-icon [name]="currentTheme === 'dark' ? 'sunny-outline' : 'moon-outline'" class="text-xl"></ion-icon>
    </button>

    <!-- Notifications -->
    <div class="relative">
      <button (click)="toggleNotifications()"
        class="p-2 rounded-lg text-dark-text hover-theme-text hover-theme-bg transition-all duration-200 relative">
        <ion-icon name="notifications-outline" class="text-xl"></ion-icon>
        <span *ngIf="unreadCount > 0"
          class="absolute -top-1 -right-1 w-4 h-4 md:w-5 md:h-5 bg-red-500 text-white text-[10px] md:text-xs rounded-full flex items-center justify-center font-bold">
          {{ unreadCount }}
        </span>
      </button>

      <!-- Notifications Dropdown -->
      <div *ngIf="showNotifications"
        class="notifications-dropdown absolute right-0 top-full mt-2 w-[calc(100vw-1.5rem)] sm:w-80 max-w-sm bg-dark-secondary border border-dark-border rounded-xl shadow-xl overflow-hidden"
        [class.-right-2]="isMobile">
        <div class="px-4 py-3 border-b border-dark-border flex items-center justify-between">
          <h3 class="font-semibold text-sm text-[rgb(var(--color-heading))]">Notificaciones</h3>
          <span class="text-xs text-brand-primary cursor-pointer hover:underline">Marcar como leídas</span>
        </div>
        <div class="max-h-72 overflow-y-auto">
          <div *ngFor="let notification of notifications"
            class="px-4 py-3 transition-colors duration-200 cursor-pointer border-b border-dark-border last:border-b-0 hover:bg-dark-accent"
            [class.bg-dark-accent]="!notification.read">
            <div class="flex items-start gap-3">
              <div class="w-2 h-2 rounded-full mt-2 flex-shrink-0"
                [class.bg-brand-primary]="notification.type === 'info'"
                [class.bg-red-500]="notification.type === 'danger'"
                [class.bg-green-500]="notification.type === 'success'"
                [class.bg-yellow-500]="notification.type === 'warning'">
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm text-[rgb(var(--color-heading))] truncate">{{ notification.title }}</p>
                <span class="text-xs text-dark-text">{{ notification.time }}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="px-4 py-3 border-t border-dark-border text-center">
          <a class="text-sm text-brand-primary hover:underline cursor-pointer">Ver todas</a>
        </div>
      </div>
    </div>

    <!-- User Menu -->
    <div class="relative">
      <button (click)="toggleUserMenu()"
        class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-dark-accent transition-all duration-200">
        <div
          class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-primary to-blue-600 flex items-center justify-center text-white font-bold text-xs flex-shrink-0">
          {{ userInitials }}
        </div>
        <div class="hidden md:flex flex-col text-left">
          <span class="text-sm font-semibold text-[rgb(var(--color-heading))] leading-tight">{{ userName || 'Usuario' }}</span>
          <span class="text-[10px] text-dark-text leading-tight">{{ userRole || 'Sin rol' }}</span>
        </div>
        <ion-icon name="chevron-down-outline" class="text-dark-text text-sm hidden sm:block"></ion-icon>
      </button>

      <!-- User Dropdown -->
      <div *ngIf="showUserMenu"
        class="user-dropdown absolute right-0 top-full mt-2 w-56 bg-dark-secondary border border-dark-border rounded-xl shadow-xl overflow-hidden z-50">
        <div class="px-4 py-3 border-b border-dark-border">
          <p class="font-semibold text-sm text-[rgb(var(--color-heading))]">{{ userName }}</p>
          <p class="text-xs text-dark-text">{{ userRole }}</p>
        </div>
        <div class="py-2">
          <a class="flex items-center gap-3 px-4 py-2.5 text-dark-text hover:bg-dark-accent hover:text-white transition-colors duration-200 cursor-pointer">
            <ion-icon name="person-outline" class="text-lg"></ion-icon>
            <span class="text-sm">Mi Perfil</span>
          </a>
          <a class="flex items-center gap-3 px-4 py-2.5 text-dark-text hover:bg-dark-accent hover:text-white transition-colors duration-200 cursor-pointer">
            <ion-icon name="settings-outline" class="text-lg"></ion-icon>
            <span class="text-sm">Configuración</span>
          </a>
          <a (click)="toggleTheme()"
            class="flex sm:hidden items-center gap-3 px-4 py-2.5 text-dark-text hover:bg-dark-accent hover:text-white transition-colors duration-200 cursor-pointer">
            <ion-icon [name]="currentTheme === 'dark' ? 'sunny-outline' : 'moon-outline'" class="text-lg"></ion-icon>
            <span class="text-sm">Cambiar Tema</span>
          </a>
          <a class="flex items-center gap-3 px-4 py-2.5 text-dark-text hover:bg-dark-accent hover:text-white transition-colors duration-200 cursor-pointer">
            <ion-icon name="help-circle-outline" class="text-lg"></ion-icon>
            <span class="text-sm">Ayuda</span>
          </a>
        </div>
        <div class="py-2 border-t border-dark-border">
          <a (click)="logout()"
            class="flex items-center gap-3 px-4 py-2.5 text-red-400 hover:bg-red-500/10 transition-colors duration-200 cursor-pointer">
            <ion-icon name="log-out-outline" class="text-lg"></ion-icon>
            <span class="text-sm font-medium">{{ isLoggingOut ? 'Cerrando...' : 'Cerrar Sesión' }}</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Overlay for closing dropdowns -->
<div *ngIf="showNotifications || showUserMenu" (click)="closeDropdowns()"
  class="fixed inset-0 z-30 bg-black/10 md:bg-transparent">
</div>
