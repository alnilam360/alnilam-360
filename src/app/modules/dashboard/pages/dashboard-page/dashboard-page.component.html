<div class="dashboard-container min-h-full">
  <!-- Page Header -->
  <div class="page-header mb-4 sm:mb-6">
    <h1 class="text-xl sm:text-2xl font-bold text-white mb-1">Panel de Control SST</h1>
    <p class="text-dark-text text-sm sm:text-base">Resumen de indicadores de Seguridad y Salud en el Trabajo</p>
  </div>

  <!-- Stats Cards Row -->
  <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 md:gap-5 mb-4 sm:mb-6">
    <app-stat-card 
      *ngFor="let card of statCards"
      [title]="card.title"
      [value]="card.value"
      [change]="card.change"
      [changeType]="card.changeType"
      [icon]="card.icon"
      [iconBg]="card.iconBg">
    </app-stat-card>
  </div>

  <!-- Main Content Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 sm:gap-5 md:gap-6 mb-4 sm:mb-6">
    <!-- Monthly Chart - Takes 2 columns on large screens -->
    <div class="lg:col-span-2 order-1">
      <app-monthly-chart 
        [labels]="monthlyData.labels"
        [inspections]="monthlyData.inspections"
        [incidents]="monthlyData.incidents">
      </app-monthly-chart>
    </div>

    <!-- Progress Gauge -->
    <div class="lg:col-span-1 order-2">
      <app-progress-gauge
        [percentage]="complianceData.percentage"
        [target]="complianceData.target"
        [description]="complianceData.description"
        [details]="complianceData.details">
      </app-progress-gauge>
    </div>
  </div>

  <!-- Bottom Row -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-5 md:gap-6">
    <!-- Recent Activity -->
    <app-recent-activity [activities]="recentActivities"></app-recent-activity>

    <!-- Quick Actions -->
    <app-quick-actions [actions]="quickActions"></app-quick-actions>
  </div>
</div>
