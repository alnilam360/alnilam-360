<div class="quick-actions-card bg-dark-primary border border-dark-border rounded-xl p-3 sm:p-4 md:p-5 h-full">
  <!-- Header -->
  <div class="flex items-center justify-between mb-3 sm:mb-5">
    <div>
      <h3 class="text-base sm:text-lg font-semibold text-white">Acciones Rápidas</h3>
      <p class="text-xs sm:text-sm text-dark-text">Atajos frecuentes</p>
    </div>
  </div>

  <!-- Quick Action Buttons -->
  <div class="grid grid-cols-2 gap-2 sm:gap-3 mb-4 sm:mb-6">
    <button 
      *ngFor="let action of actions; let i = index"
      class="action-btn flex flex-col items-center justify-center p-3 sm:p-4 rounded-xl transition-all duration-200 border border-dark-border active:scale-95"
      [ngClass]="[getColorClasses(action.color).bg, getColorClasses(action.color).hover]"
      [style.animation-delay]="(i * 0.1) + 's'">
      <ion-icon 
        [name]="action.icon" 
        class="text-xl sm:text-2xl mb-1 sm:mb-2"
        [ngClass]="getColorClasses(action.color).text">
      </ion-icon>
      <span class="text-[10px] sm:text-xs text-white font-medium text-center leading-tight">{{ action.label }}</span>
    </button>
  </div>

  <!-- Upcoming Tasks Section -->
  <div class="upcoming-section border-t border-dark-border pt-3 sm:pt-5">
    <div class="flex items-center justify-between mb-3 sm:mb-4">
      <h4 class="text-xs sm:text-sm font-semibold text-white">Próximas Tareas</h4>
      <a class="text-[10px] sm:text-xs text-brand-primary hover:underline cursor-pointer">Ver calendario</a>
    </div>

    <div class="space-y-2 sm:space-y-3">
      <div 
        *ngFor="let task of upcomingTasks"
        class="task-item flex items-center gap-2 sm:gap-3 p-2 sm:p-3 rounded-lg bg-dark-accent/30 hover:bg-dark-accent/50 transition-colors duration-200 cursor-pointer active:scale-[0.98]">
        <span 
          class="w-2 h-2 rounded-full flex-shrink-0"
          [ngClass]="getPriorityClass(task.priority)">
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-xs sm:text-sm text-white truncate">{{ task.title }}</p>
          <span class="text-[10px] sm:text-xs text-dark-text">{{ task.date }}</span>
        </div>
        <ion-icon name="chevron-forward-outline" class="text-dark-text text-sm sm:text-base"></ion-icon>
      </div>
    </div>
  </div>
</div>
