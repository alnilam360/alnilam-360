<div class="chart-card bg-dark-primary border border-dark-border rounded-xl p-3 sm:p-4 md:p-5">
  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4 sm:mb-6">
    <div>
      <h3 class="text-base sm:text-lg font-semibold text-white">Actividad Mensual SST</h3>
      <p class="text-xs sm:text-sm text-dark-text">Inspecciones e incidentes del año</p>
    </div>
    <div class="flex items-center justify-between sm:justify-end gap-2 sm:gap-4">
      <!-- Legend -->
      <div class="flex items-center gap-3 sm:gap-4">
        <div class="flex items-center gap-1.5 sm:gap-2">
          <span class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-brand-primary"></span>
          <span class="text-xs sm:text-sm text-dark-text">Inspecciones</span>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2">
          <span class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full bg-red-500"></span>
          <span class="text-xs sm:text-sm text-dark-text">Incidentes</span>
        </div>
      </div>
      <button class="p-1.5 rounded-lg hover:bg-dark-accent text-dark-text hidden sm:block">
        <ion-icon name="ellipsis-vertical" class="text-lg"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Chart Area -->
  <div class="chart-container flex overflow-x-auto pb-2">
    <!-- Y Axis -->
    <div class="y-axis flex flex-col justify-between text-right pr-2 sm:pr-3 text-[10px] sm:text-xs text-dark-text h-40 sm:h-52 md:h-64 flex-shrink-0">
      <span *ngFor="let label of getYAxisLabels()">{{ label }}</span>
    </div>

    <!-- Bars Container -->
    <div class="bars-container flex-1 flex items-end justify-between gap-1 sm:gap-2 h-40 sm:h-52 md:h-64 border-l border-b border-dark-border pl-2 sm:pl-3 pb-2 sm:pb-3 min-w-[400px] sm:min-w-0">
      <div 
        *ngFor="let bar of chartBars" 
        class="bar-group flex flex-col items-center flex-1">
        <div class="bars flex items-end gap-0.5 sm:gap-1 h-32 sm:h-44 md:h-52 w-full justify-center">
          <!-- Inspection Bar -->
          <div 
            class="inspection-bar w-2.5 sm:w-3 md:w-4 rounded-t-sm bg-brand-primary transition-all duration-500 hover:opacity-80 cursor-pointer relative group"
            [style.height]="bar.inspectionHeight">
            <div class="tooltip absolute -top-8 left-1/2 -translate-x-1/2 bg-dark-accent px-2 py-1 rounded text-xs text-white whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-10">
              {{ bar.inspection }}
            </div>
          </div>
          <!-- Incident Bar -->
          <div 
            class="incident-bar w-2.5 sm:w-3 md:w-4 rounded-t-sm bg-red-500 transition-all duration-500 hover:opacity-80 cursor-pointer relative group"
            [style.height]="bar.incidentHeight">
            <div class="tooltip absolute -top-8 left-1/2 -translate-x-1/2 bg-dark-accent px-2 py-1 rounded text-xs text-white whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity z-10">
              {{ bar.incident }}
            </div>
          </div>
        </div>
        <span class="text-[10px] sm:text-xs text-dark-text mt-1 sm:mt-2">{{ bar.label }}</span>
      </div>
    </div>
  </div>
</div>
