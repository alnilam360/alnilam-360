<div class="activity-card bg-dark-primary border border-dark-border rounded-xl p-3 sm:p-4 md:p-5">
  <!-- Header -->
  <div class="flex items-center justify-between mb-3 sm:mb-5">
    <div>
      <h3 class="text-base sm:text-lg font-semibold text-white">Actividad Reciente</h3>
      <p class="text-xs sm:text-sm text-dark-text">Últimas acciones del sistema</p>
    </div>
    <a class="text-xs sm:text-sm text-brand-primary hover:underline cursor-pointer">Ver todo</a>
  </div>

  <!-- Activity List -->
  <div class="activity-list space-y-2 sm:space-y-3 md:space-y-4 max-h-[350px] sm:max-h-[400px] overflow-y-auto pr-1">
    <div 
      *ngFor="let activity of activities; let i = index"
      class="activity-item flex items-start gap-2 sm:gap-3 md:gap-4 p-2 sm:p-3 rounded-lg hover:bg-dark-accent/50 transition-colors duration-200 cursor-pointer"
      [style.animation-delay]="(i * 0.1) + 's'">
      
      <!-- Icon -->
      <div 
        class="icon-wrapper w-8 h-8 sm:w-9 sm:h-9 md:w-10 md:h-10 rounded-lg flex items-center justify-center flex-shrink-0"
        [ngClass]="getTypeBgColor(activity.type)">
        <ion-icon 
          [name]="getTypeIcon(activity.type)" 
          class="text-base sm:text-lg md:text-xl"
          [ngClass]="getTypeIconColor(activity.type)">
        </ion-icon>
      </div>

      <!-- Content -->
      <div class="flex-1 min-w-0">
        <div class="flex items-start justify-between gap-1 sm:gap-2">
          <div class="min-w-0 flex-1">
            <h4 class="text-xs sm:text-sm font-medium text-white truncate">{{ activity.title }}</h4>
            <p class="text-[10px] sm:text-xs text-dark-text truncate mt-0.5">{{ activity.description }}</p>
          </div>
          <span 
            class="px-1.5 sm:px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-medium whitespace-nowrap flex-shrink-0"
            [ngClass]="getStatusBadge(activity.status).class">
            {{ getStatusBadge(activity.status).text }}
          </span>
        </div>
        <span class="text-[10px] sm:text-xs text-dark-text mt-1 sm:mt-2 block">{{ activity.time }}</span>
      </div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="activities.length === 0" class="text-center py-6 sm:py-8">
    <ion-icon name="time-outline" class="text-3xl sm:text-4xl text-dark-text mb-2"></ion-icon>
    <p class="text-dark-text text-sm">No hay actividad reciente</p>
  </div>
</div>
