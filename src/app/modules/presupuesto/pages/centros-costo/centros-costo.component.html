<div class="space-y-6">
  <app-presupuesto-cabecera titulo="Centros de costo" subtitulo="Áreas o proyectos para distribuir el gasto"
    icono="pi-sitemap" [esAdmin]="esAdmin()" [empresas]="empresas()" [empresaId]="empresaId()"
    [mostrarPeriodo]="false"
    (empresaChange)="cargar($event)"></app-presupuesto-cabecera>

  <div class="bg-dark-secondary border border-dark-border rounded-2xl shadow-xl overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-dark-border bg-dark-primary/30">
      <h3 class="text-base font-semibold text-[rgb(var(--color-heading))]">Centros de costo</h3>
      <button (click)="abrir()" [disabled]="!empresaId()"
        class="flex items-center justify-center gap-2 px-3.5 py-2 bg-brand-primary hover:bg-blue-600 text-white text-xs rounded-lg font-medium transition-all duration-200 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="pi pi-plus text-sm"></i>
        <span>Nuevo centro</span>
      </button>
    </div>

    <div class="px-4 pb-4">
      <div *ngIf="error() as msg" class="mt-4 px-3 py-2 rounded-lg bg-red-500/20 text-red-400 text-xs">{{ msg }}</div>

      <div *ngIf="cargando()" class="flex items-center justify-center py-12">
        <i class="pi pi-spin pi-spinner text-brand-primary text-2xl"></i>
      </div>

      <div *ngIf="!cargando() && !error() && centros().length === 0"
        class="flex flex-col items-center justify-center py-12 text-center border border-dashed border-dark-border rounded-xl my-4">
        <i class="pi pi-sitemap text-3xl text-dark-text mb-2"></i>
        <p class="text-xs text-dark-text font-medium">No hay centros de costo registrados</p>
      </div>

      <div *ngIf="!cargando() && centros().length > 0" class="overflow-x-auto mt-2">
        <table class="w-full text-left text-xs">
          <thead class="bg-dark-primary/60 border-b border-dark-border text-dark-text uppercase text-[10px]">
            <tr>
              <th class="px-3 py-2.5 font-semibold">Nombre</th>
              <th class="px-3 py-2.5 font-semibold">Código</th>
              <th class="px-3 py-2.5 font-semibold">Estado</th>
              <th class="px-3 py-2.5 font-semibold text-center">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-dark-border">
            <tr *ngFor="let c of centros(); trackBy: trackById" class="hover:bg-dark-primary/40 transition-colors duration-150">
              <td class="px-3 py-2 font-medium text-[rgb(var(--color-heading))]">{{ c.nombre }}</td>
              <td class="px-3 py-2 text-dark-text">{{ c.codigo || '—' }}</td>
              <td class="px-3 py-2">
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-medium"
                  [ngClass]="c.activo ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-500/20 text-slate-400'">
                  {{ c.activo ? 'Activo' : 'Inactivo' }}
                </span>
              </td>
              <td class="px-3 py-2 text-center">
                <div class="flex items-center justify-center gap-1">
                  <button (click)="abrir(c)" title="Editar centro" aria-label="Editar centro"
                    class="p-1.5 rounded-lg text-dark-text hover:text-blue-400 hover:bg-dark-accent transition-all duration-200">
                    <i class="pi pi-pencil text-sm"></i>
                  </button>
                  <button (click)="aEliminar.set(c)" title="Eliminar centro" aria-label="Eliminar centro"
                    class="p-1.5 rounded-lg text-dark-text hover:text-red-400 hover:bg-dark-accent transition-all duration-200">
                    <i class="pi pi-trash text-sm"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div *ngIf="modalAbierto()"
  class="fixed inset-0 z-[60] flex items-start justify-center overflow-y-auto bg-black/60 backdrop-blur-sm p-4"
  (click)="modalAbierto.set(false)">
  <div class="relative w-full max-w-2xl my-8 bg-dark-secondary border border-dark-border rounded-2xl shadow-2xl"
    (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between px-4 py-3 border-b border-dark-border">
      <h3 class="text-base font-semibold text-[rgb(var(--color-heading))]">{{ editandoId() ? 'Editar centro' : 'Nuevo centro' }}</h3>
      <button (click)="modalAbierto.set(false)" title="Cerrar formulario" aria-label="Cerrar formulario"
        class="p-1.5 rounded-lg text-dark-text hover:text-[rgb(var(--color-heading))] hover:bg-dark-accent transition-all duration-200">
        <i class="pi pi-times text-lg"></i>
      </button>
    </div>

    <div class="px-4 py-4 max-h-[calc(100vh-200px)] overflow-y-auto custom-scrollbar">
      <form [formGroup]="form" (ngSubmit)="guardar()" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="md:col-span-2">
          <label class="block text-xs font-medium text-dark-text mb-1">Nombre <span class="text-red-400">*</span></label>
          <input type="text" formControlName="nombre" class="form-input">
        </div>
        <div>
          <label class="block text-xs font-medium text-dark-text mb-1">Código</label>
          <input type="text" formControlName="codigo" class="form-input">
        </div>
        <label class="flex items-center gap-2 text-xs text-dark-text md:self-end md:pb-2">
          <input type="checkbox" formControlName="activo" class="form-checkbox"> Activo
        </label>
        <p *ngIf="errorForm() as msg" class="md:col-span-2 text-xs text-red-400">{{ msg }}</p>
      </form>
    </div>

    <div class="flex items-center justify-end gap-2 px-4 py-3 border-t border-dark-border bg-dark-primary/50">
      <button (click)="modalAbierto.set(false)"
        class="px-3 py-2 text-sm rounded-lg border border-dark-border text-[rgb(var(--color-heading))] hover:bg-dark-accent transition-all duration-200">
        Cancelar
      </button>
      <button (click)="guardar()" [disabled]="form.invalid || guardando()"
        class="px-4 py-2 text-sm rounded-lg bg-brand-primary hover:bg-blue-600 text-white font-medium transition-all duration-200 shadow-lg shadow-brand-primary/25 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ guardando() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </div>
</div>

<app-presupuesto-confirmar *ngIf="aEliminar() as c" [nombre]="c.nombre" [guardando]="guardando()"
  (confirmar)="eliminar()" (cancelar)="aEliminar.set(null)"></app-presupuesto-confirmar>
