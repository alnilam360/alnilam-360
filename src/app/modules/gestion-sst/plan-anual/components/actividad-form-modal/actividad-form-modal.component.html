<div class="actividad-modal">

  <!-- HEADER -->
  <div class="flex items-center gap-3 px-4 py-3 border-b border-dark-border bg-dark-secondary shrink-0">
    <div class="w-8 h-8 rounded-lg bg-brand-primary/10 flex items-center justify-center shrink-0">
      <ion-icon name="calendar-outline" class="text-brand-primary text-base"></ion-icon>
    </div>
    <div class="flex-1 min-w-0">
      <h3 class="text-sm font-bold text-[rgb(var(--color-heading))]">
        {{ actividad ? 'Editar Actividad' : 'Nueva Actividad' }}
      </h3>
      <p class="text-[10px] text-dark-text">Plan de Trabajo · {{ plan?.anio }}</p>
    </div>
    <button (click)="cancelar()"
            class="p-1.5 rounded-lg text-dark-text hover:text-[rgb(var(--color-heading))]
                   hover:bg-dark-accent border border-transparent hover:border-dark-border transition-all">
      <ion-icon name="close-outline" class="text-lg"></ion-icon>
    </button>
  </div>

  <!-- ERROR -->
  <div *ngIf="errorMsg"
       class="shrink-0 mx-4 mt-3 flex items-start gap-2.5 p-3 bg-red-500/10 border border-red-500/30 rounded-lg">
    <ion-icon name="alert-circle-outline" class="text-red-400 text-base shrink-0 mt-0.5"></ion-icon>
    <span class="text-xs text-red-300 flex-1">{{ errorMsg }}</span>
    <button (click)="errorMsg = null" class="text-red-400 hover:text-red-200">
      <ion-icon name="close-outline" class="text-base"></ion-icon>
    </button>
  </div>

  <!-- BODY SCROLLABLE -->
  <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3">

    <!-- FASE PHVA -->
    <div class="campo-auxiliar" style="display:block; padding: 0.625rem 0.75rem;">
      <span class="campo-label">Fase PHVA <span class="text-brand-danger normal-case font-normal">*</span></span>
      <div class="flex flex-wrap gap-2 mt-2">
        <button *ngFor="let f of fases" type="button"
                (click)="toggleFase(f.nombre)"
                class="fase-chip px-3 py-1 rounded-full text-xs font-semibold border transition-all duration-150"
                [class.fase-planear]="f.nombre === 'Planear' && fasSeleccionada(f.nombre)"
                [class.fase-hacer]="f.nombre === 'Hacer' && fasSeleccionada(f.nombre)"
                [class.fase-verificar]="f.nombre === 'Verificar' && fasSeleccionada(f.nombre)"
                [class.fase-actuar]="f.nombre === 'Actuar' && fasSeleccionada(f.nombre)"
                [class.fase-off]="!fasSeleccionada(f.nombre)">
          {{ f.nombre }}
        </button>
      </div>
    </div>

    <!-- PROGRAMA -->
    <div class="campo-auxiliar">
      <ion-icon name="layers-outline" class="campo-icon"></ion-icon>
      <div class="campo-body">
        <span class="campo-label">Programa <span class="text-brand-danger">*</span></span>
        <select [(ngModel)]="form.programa_id" name="programa_id" class="campo-input">
          <option value="">— Seleccionar programa —</option>
          <option *ngFor="let p of programas" [value]="p.id">{{ p.nombre }}</option>
        </select>
      </div>
    </div>

    <!-- ACTIVIDAD -->
    <div class="campo-auxiliar">
      <ion-icon name="construct-outline" class="campo-icon mt-0.5"></ion-icon>
      <div class="campo-body">
        <span class="campo-label">Actividad <span class="text-brand-danger">*</span></span>
        <textarea rows="3" [(ngModel)]="form.actividad" name="actividad"
                  placeholder="Descripción de la actividad..."
                  class="campo-input"></textarea>
      </div>
    </div>

    <!-- CIUDAD -->
    <div class="campo-auxiliar">
      <ion-icon name="location-outline" class="campo-icon"></ion-icon>
      <div class="campo-body">
        <span class="campo-label">Ciudad / Sede</span>
        <select [(ngModel)]="form.ciudad" name="ciudad" class="campo-input">
          <option value="">— Seleccionar —</option>
          <option *ngFor="let c of ciudadesDisponibles" [value]="c">{{ c }}</option>
        </select>
      </div>
    </div>

    <!-- GRUPO OBJETIVO -->
    <div class="campo-auxiliar">
      <ion-icon name="people-outline" class="campo-icon"></ion-icon>
      <div class="campo-body">
        <span class="campo-label">Grupo Objetivo <span class="text-brand-danger">*</span></span>
        <select [ngModel]="grupoSeleccionadoId"
                (ngModelChange)="onGrupoChange($event)"
                name="grupo_objetivo"
                class="campo-input">
          <option value="">— Seleccionar grupo —</option>
          <option *ngFor="let g of gruposObjetivo" [value]="g.id">{{ g.nombre }}</option>
        </select>
      </div>
    </div>

    <!-- RESPONSABLE -->
    <div class="campo-auxiliar">
      <ion-icon name="person-outline" class="campo-icon"></ion-icon>
      <div class="campo-body">
        <span class="campo-label">Responsable <span class="text-brand-danger">*</span></span>
        <select [(ngModel)]="form.responsable_id" name="responsable_id" class="campo-input">
          <option value="">— Seleccionar responsable —</option>
          <option *ngFor="let r of responsables" [value]="r.id">{{ r.nombre }}</option>
        </select>
      </div>
    </div>

    <!-- EVIDENCIA -->
    <div class="campo-auxiliar">
      <ion-icon name="document-text-outline" class="campo-icon mt-0.5"></ion-icon>
      <div class="campo-body">
        <span class="campo-label">Evidencia</span>
        <textarea rows="2" [(ngModel)]="form.evidencia" name="evidencia"
                  placeholder="Descripción de la evidencia o enlace..."
                  class="campo-input"></textarea>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="shrink-0 flex items-center justify-end gap-2 px-4 py-3 bg-dark-secondary border-t border-dark-border">
    <button type="button" (click)="cancelar()"
            class="px-4 py-2 text-sm font-medium text-dark-text hover:text-[rgb(var(--color-heading))]
                   bg-dark-accent hover:bg-dark-border rounded-lg border border-dark-border transition-all">
      Cancelar
    </button>
    <button type="button" (click)="guardar()" [disabled]="guardando"
            class="flex items-center gap-2 px-5 py-2 text-sm font-semibold text-white
                   bg-brand-primary hover:bg-blue-600 rounded-lg shadow-lg shadow-brand-primary/25
                   disabled:opacity-50 disabled:cursor-not-allowed transition-all">
      <ion-icon *ngIf="guardando" name="hourglass-outline" class="text-base animate-spin"></ion-icon>
      <ion-icon *ngIf="!guardando" name="save-outline" class="text-base"></ion-icon>
      {{ actividad ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>

</div>
