<div class="bg-dark-secondary border border-dark-border rounded-xl p-4 space-y-3">
  <div>
    <h3 class="text-sm font-semibold text-[rgb(var(--color-heading))]"><i class="pi pi-chart-bar mr-1.5 text-brand-primary"></i>Diagnóstico general de salud</h3>
    <p class="text-xs text-dark-text mt-0.5">Datos agregados, sin información individual (Res. 1843/2025 Art. 20)</p>
  </div>

  <p *ngIf="vacio" class="py-4 text-center text-xs text-dark-text">Sin datos para el periodo</p>

  <div *ngIf="!vacio" class="space-y-4">
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
      <div *ngFor="let i of grupos.poblacion; trackBy: trackByClave" class="p-3 bg-brand-primary/10 border border-brand-primary/30 rounded-lg text-center">
        <p class="text-2xl font-bold text-brand-primary">{{ i.n }}</p>
        <p class="text-[10px] uppercase tracking-wider text-dark-text mt-1">{{ i.etiqueta }}</p>
      </div>
      <div *ngFor="let i of grupos.restricciones; trackBy: trackByClave" class="p-3 bg-dark-primary/40 border border-dark-border rounded-lg text-center">
        <p class="text-2xl font-bold text-amber-400">{{ i.n }}</p>
        <p class="text-[10px] uppercase tracking-wider text-dark-text mt-1">{{ i.etiqueta }}</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div *ngIf="grupos.aptitud.length">
        <p class="text-xs font-semibold text-dark-text uppercase tracking-wide mb-2">Concepto de aptitud</p>
        <div *ngFor="let i of grupos.aptitud; trackBy: trackByClave" class="mb-2">
          <div class="flex justify-between text-xs text-[rgb(var(--color-heading))]"><span>{{ i.etiqueta }}</span><span class="font-semibold">{{ i.n }}</span></div>
          <div class="h-1.5 rounded-full bg-dark-primary/60 overflow-hidden"><div class="h-full bg-brand-primary" [style.width.%]="i.pct"></div></div>
        </div>
      </div>
      <div *ngIf="grupos.vigencia.length">
        <p class="text-xs font-semibold text-dark-text uppercase tracking-wide mb-2">Vigencia del examen</p>
        <div *ngFor="let i of grupos.vigencia; trackBy: trackByClave" class="mb-2">
          <div class="flex justify-between text-xs text-[rgb(var(--color-heading))]"><span>{{ i.etiqueta }}</span><span class="font-semibold">{{ i.n }}</span></div>
          <div class="h-1.5 rounded-full bg-dark-primary/60 overflow-hidden"><div class="h-full bg-brand-primary" [style.width.%]="i.pct"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
