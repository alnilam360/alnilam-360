<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
  <form [formGroup]="form" (ngSubmit)="guardar()"
        class="w-full max-w-lg max-h-[90vh] flex flex-col bg-dark-secondary border border-dark-border rounded-xl">
    <div class="flex items-center gap-3 px-4 py-3 border-b border-dark-border">
      <h3 class="flex-1 text-sm font-bold text-[rgb(var(--color-heading))]">{{ tema ? 'Editar tema' : 'Nuevo tema' }}</h3>
      <button type="button" (click)="cancelado.emit()" class="p-1.5 text-dark-text"><i class="pi pi-times"></i></button>
    </div>

    <div *ngIf="errorMsg" class="mx-4 mt-3 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-xs text-red-300">{{ errorMsg }}</div>

    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-3 text-xs text-dark-text">
      <label class="block">Nombre *
        <input formControlName="nombre" type="text" class="mt-1 w-full px-3 py-2 min-h-10 rounded-lg bg-dark-primary border border-dark-border text-[rgb(var(--color-heading))]" />
        <span *ngIf="form.controls.nombre.touched && form.controls.nombre.invalid" class="text-red-300">El nombre es obligatorio.</span>
      </label>
      <label class="block">Descripción
        <textarea formControlName="descripcion" rows="2" class="mt-1 w-full px-3 py-2 rounded-lg bg-dark-primary border border-dark-border text-[rgb(var(--color-heading))]"></textarea>
      </label>
      <label class="block">Grupo objetivo
        <select formControlName="grupo_objetivo_id" class="mt-1 w-full px-3 py-2 min-h-10 rounded-lg bg-dark-primary border border-dark-border text-[rgb(var(--color-heading))]">
          <option value="">— Sin grupo —</option>
          <option *ngFor="let g of grupos" [value]="g.id">{{ g.nombre }}</option>
        </select>
      </label>
      <label class="block">Fuente
        <select formControlName="fuente" class="mt-1 w-full px-3 py-2 min-h-10 rounded-lg bg-dark-primary border border-dark-border text-[rgb(var(--color-heading))]">
          <option *ngFor="let f of fuentes" [value]="f">{{ f }}</option>
        </select>
      </label>
      <label class="block">Horas mínimas
        <input formControlName="horas_min" type="number" min="0" step="0.5" class="mt-1 w-full px-3 py-2 min-h-10 rounded-lg bg-dark-primary border border-dark-border text-[rgb(var(--color-heading))]" />
        <span *ngIf="form.controls.horas_min.invalid" class="text-red-300">Debe ser 0 o mayor.</span>
      </label>
      <div class="flex gap-6">
        <label class="flex items-center gap-2"><input type="checkbox" formControlName="obligatorio" /> Obligatorio</label>
        <label class="flex items-center gap-2"><input type="checkbox" formControlName="activo" /> Activo</label>
      </div>
    </div>

    <div class="flex justify-end gap-2 px-4 py-3 border-t border-dark-border">
      <button type="button" (click)="cancelado.emit()" [disabled]="guardando"
              class="px-3 py-2 min-h-10 text-xs rounded-lg border border-dark-border text-dark-text">Cancelar</button>
      <button type="submit" [disabled]="guardando || form.invalid"
              class="px-3 py-2 min-h-10 text-xs rounded-lg bg-brand-primary text-white disabled:opacity-50">
        {{ guardando ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
