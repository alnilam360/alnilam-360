<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
  <div class="w-full max-w-2xl max-h-[90vh] flex flex-col bg-dark-secondary border border-dark-border rounded-xl">
    <div class="flex items-center gap-3 px-4 py-3 border-b border-dark-border">
      <h3 class="flex-1 text-sm font-bold text-[rgb(var(--color-heading))]">Asistencia · {{ sesion.fecha }}</h3>
      <button type="button" (click)="cerrado.emit()" class="p-1.5 text-dark-text"><i class="pi pi-times"></i></button>
    </div>

    <div *ngIf="errorMsg" class="mx-4 mt-3 p-3 bg-red-500/10 border border-red-500/30 rounded-lg text-xs text-red-300">{{ errorMsg }}</div>
    <div *ngIf="okMsg" class="mx-4 mt-3 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-xs text-emerald-300">{{ okMsg }}</div>

    <div class="flex-1 overflow-auto px-4 py-4">
      <p *ngIf="cargando" class="text-xs text-dark-text text-center">Cargando…</p>
      <p *ngIf="!cargando && filas.length === 0 && !errorMsg" class="text-xs text-dark-text text-center">Sin trabajadores activos para esta sesión.</p>
      <table *ngIf="filas.length > 0" class="w-full text-xs min-w-[420px]">
        <thead>
          <tr class="text-left text-dark-text uppercase tracking-wide border-b border-dark-border">
            <th class="px-2 py-2">Trabajador</th>
            <th class="px-2 py-2">Asistió</th>
            <th class="px-2 py-2">Nota (0–100)</th>
            <th class="px-2 py-2">Aprobado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let f of filas.controls; trackBy: trackFila" [formGroup]="f" class="border-b border-dark-border/50 h-10">
            <td class="px-2 py-1 text-[rgb(var(--color-heading))]">{{ f.controls.nombre.value }}</td>
            <td class="px-2 py-1"><input type="checkbox" formControlName="asistio" /></td>
            <td class="px-2 py-1">
              <input type="number" min="0" max="100" formControlName="nota_evaluacion"
                     class="w-20 px-2 py-1 rounded bg-dark-primary border border-dark-border text-[rgb(var(--color-heading))]" />
            </td>
            <td class="px-2 py-1"><input type="checkbox" formControlName="aprobado" /></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex justify-end gap-2 px-4 py-3 border-t border-dark-border">
      <button type="button" (click)="cerrado.emit()" [disabled]="guardando"
              class="px-3 py-2 min-h-10 text-xs rounded-lg border border-dark-border text-dark-text">Cerrar</button>
      <button type="button" (click)="guardar()" [disabled]="guardando || cargando || filas.invalid || filas.length === 0"
              class="px-3 py-2 min-h-10 text-xs rounded-lg bg-brand-primary text-white disabled:opacity-50">
        {{ guardando ? 'Guardando…' : 'Guardar asistencia' }}
      </button>
    </div>
  </div>
</div>
