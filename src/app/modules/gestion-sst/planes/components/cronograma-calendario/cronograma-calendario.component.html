<div class="p-3">
  <div class="flex items-center justify-between mb-3">
    <button type="button" (click)="mesAnterior()" [disabled]="mes0 === 0" title="Mes anterior"
            class="min-h-10 min-w-10 border border-dark-border rounded-lg text-dark-text disabled:opacity-40">
      <i class="pi pi-chevron-left"></i>
    </button>
    <span class="text-sm font-semibold text-[rgb(var(--color-heading))]">{{ etiquetaMes() }}</span>
    <button type="button" (click)="mesSiguiente()" [disabled]="mes0 === 11" title="Mes siguiente"
            class="min-h-10 min-w-10 border border-dark-border rounded-lg text-dark-text disabled:opacity-40">
      <i class="pi pi-chevron-right"></i>
    </button>
  </div>

  <div class="overflow-x-auto">
    <div class="min-w-[560px]">
      <div class="grid grid-cols-7 gap-px mb-1">
        <div *ngFor="let n of diasSemana" class="text-[10px] uppercase text-dark-text text-center">{{ n }}</div>
      </div>
      <div class="grid grid-cols-7 gap-px bg-dark-border border border-dark-border">
        <ng-container *ngFor="let sem of semanas">
          <div *ngFor="let d of sem; trackBy: trackDia" class="bg-dark-secondary min-h-[88px] p-1 flex flex-col gap-1"
               [class.opacity-40]="!d.delMes">
            <span class="text-[10px] text-dark-text w-5 h-5 flex items-center justify-center rounded-full"
                  [class.bg-brand-primary]="d.hoy" [class.text-white]="d.hoy">{{ d.fecha.slice(8) }}</span>
            <button *ngFor="let s of d.sesiones; trackBy: trackSesion" type="button" (click)="onChip(s)"
                    class="min-h-10 px-1 rounded text-[10px] text-left truncate" [ngClass]="badge(s.estado)">
              {{ nombreTema[s.tema_id] || '—' }}
            </button>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
