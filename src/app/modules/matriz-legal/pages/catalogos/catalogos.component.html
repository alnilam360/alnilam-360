<div class="ml-page">
  <div class="ml-topbar">
    <div class="ml-topbar__title">
      <div class="ml-icon-badge"><ion-icon name="options-outline"></ion-icon></div>
      <div>
        <h1>Catálogos</h1>
        <p>Componentes de la matriz y tipos de norma</p>
      </div>
    </div>
    <div class="ml-topbar__actions">
      <select *ngIf="esAdmin() && empresas().length > 1" class="ml-select"
              [ngModel]="empresaId()" (ngModelChange)="onEmpresaChange($event)">
        <option *ngFor="let e of empresas()" [value]="e.id">{{ e.nombre }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="cargando()" class="ml-empty">
    <ion-spinner name="crescent"></ion-spinner><span>Cargando…</span>
  </div>

  <ng-container *ngIf="!cargando()">
    <!-- Componentes -->
    <section class="ml-card">
      <div class="ml-card__head"><h2><ion-icon name="layers-outline"></ion-icon> Componentes</h2></div>

      <div class="ml-add-row">
        <select class="ml-input" [ngModel]="nuevoDominio()" (ngModelChange)="nuevoDominio.set($event)">
          <option *ngFor="let d of DOMINIOS" [value]="d">{{ DOMINIO_LABEL[d] }}</option>
        </select>
        <input class="ml-input" [ngModel]="nuevoNombre()" (ngModelChange)="nuevoNombre.set($event)"
               placeholder="Nombre del componente" (keyup.enter)="agregarComponente()">
        <button class="ml-btn ml-btn--primary" (click)="agregarComponente()">
          <ion-icon name="add-outline"></ion-icon> Agregar
        </button>
      </div>

      <div class="ml-dominio" *ngFor="let d of DOMINIOS">
        <div class="ml-dominio__head"><h2>{{ DOMINIO_LABEL[d] }}</h2></div>
        <div class="ml-chips-list">
          <span *ngFor="let c of componentesPorDominio(d)"
                class="ml-chip" [class.is-off]="!c.activo"
                [ngClass]="c.activo ? 'ml-chip--success' : 'ml-chip--medium'">
            {{ c.nombre }}
            <small *ngIf="esGlobal(c)" class="ml-tag-base">base</small>
            <button class="ml-chip__toggle" (click)="toggleActivo(c)" [title]="c.activo ? 'Desactivar' : 'Activar'">
              <ion-icon [name]="c.activo ? 'eye-outline' : 'eye-off-outline'"></ion-icon>
            </button>
          </span>
        </div>
      </div>
    </section>

    <!-- Tipos de norma -->
    <section class="ml-card">
      <div class="ml-card__head"><h2><ion-icon name="document-outline"></ion-icon> Tipos de norma</h2></div>
      <div class="ml-add-row" *ngIf="esAdmin()">
        <input class="ml-input" [ngModel]="nuevoTipoNombre()" (ngModelChange)="nuevoTipoNombre.set($event)"
               placeholder="Ej: Ordenanza" (keyup.enter)="agregarTipoNorma()">
        <button class="ml-btn ml-btn--primary" (click)="agregarTipoNorma()">
          <ion-icon name="add-outline"></ion-icon> Agregar
        </button>
      </div>
      <p *ngIf="!esAdmin()" class="ml-note">Los tipos de norma los gestiona un administrador.</p>
      <div class="ml-chips-list">
        <span *ngFor="let t of tiposNorma()" class="ml-chip ml-chip--medium">{{ t.nombre }}</span>
      </div>
    </section>
  </ng-container>
</div>
