<div class="space-y-4">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
    <p class="text-xs text-dark-text">
      Parámetros mensuales del año {{ anio }} · alimentan Frecuencia, Severidad, Tasa (Res. 0312) e Índices GTC 3701.
    </p>
    <div class="flex items-center gap-2">
      <button (click)="copiarTrabajadoresATodos()" class="text-[11px] text-dark-text hover:text-brand-primary flex items-center gap-1">
        <ion-icon name="copy-outline"></ion-icon> N.º trab. a todos
      </button>
      <button (click)="copiarMetasATodos()" class="text-[11px] text-dark-text hover:text-brand-primary flex items-center gap-1">
        <ion-icon name="copy-outline"></ion-icon> Metas a todos
      </button>
    </div>
  </div>

  <div *ngIf="error()" class="flex items-start gap-3 p-3.5 bg-red-500/10 border border-red-500/30 rounded-xl">
    <ion-icon name="alert-circle-outline" class="text-red-400 text-xl flex-shrink-0 mt-0.5"></ion-icon>
    <p class="text-sm text-red-300 flex-1">{{ error() }}</p>
  </div>
  <div *ngIf="ok()" class="flex items-center gap-2 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl">
    <ion-icon name="checkmark-circle-outline" class="text-emerald-400 text-lg"></ion-icon>
    <p class="text-sm text-emerald-300">Parámetros guardados.</p>
  </div>

  <div *ngIf="loading()" class="flex items-center justify-center py-12">
    <ion-spinner name="crescent" class="text-brand-primary"></ion-spinner>
  </div>

  <div *ngIf="!loading()" class="overflow-x-auto bg-dark-secondary border border-dark-border rounded-xl">
    <table class="w-full min-w-[720px] text-sm">
      <thead>
        <tr class="text-[10px] uppercase tracking-wider text-dark-text border-b border-dark-border">
          <th class="text-left font-semibold px-3 py-2.5">Mes</th>
          <th class="text-left font-semibold px-3 py-2.5">N.º trabajadores</th>
          <th class="text-left font-semibold px-3 py-2.5">Horas-hombre</th>
          <th class="text-left font-semibold px-3 py-2.5">Meta IF</th>
          <th class="text-left font-semibold px-3 py-2.5">Meta IS</th>
          <th class="text-left font-semibold px-3 py-2.5">Meta Severidad</th>
          <th class="text-left font-semibold px-3 py-2.5">Meta Tasa %</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of filas" class="border-b border-dark-border/50">
          <td class="px-3 py-2 text-[rgb(var(--color-heading))] font-medium">{{ meses[f.mes - 1] }}</td>
          <td class="px-2 py-1.5"><input [(ngModel)]="f.numero_trabajadores" type="number" min="0" class="w-24 px-2 py-1 bg-dark-primary border border-dark-border rounded text-xs text-[rgb(var(--color-heading))] focus:outline-none focus:border-brand-primary"></td>
          <td class="px-2 py-1.5"><input [(ngModel)]="f.horas_hombre" type="number" min="0" class="w-28 px-2 py-1 bg-dark-primary border border-dark-border rounded text-xs text-[rgb(var(--color-heading))] focus:outline-none focus:border-brand-primary"></td>
          <td class="px-2 py-1.5"><input [(ngModel)]="f.meta_if" type="number" step="0.1" class="w-20 px-2 py-1 bg-dark-primary border border-dark-border rounded text-xs text-[rgb(var(--color-heading))] focus:outline-none focus:border-brand-primary"></td>
          <td class="px-2 py-1.5"><input [(ngModel)]="f.meta_is" type="number" step="0.1" class="w-20 px-2 py-1 bg-dark-primary border border-dark-border rounded text-xs text-[rgb(var(--color-heading))] focus:outline-none focus:border-brand-primary"></td>
          <td class="px-2 py-1.5"><input [(ngModel)]="f.meta_severidad" type="number" step="0.1" class="w-20 px-2 py-1 bg-dark-primary border border-dark-border rounded text-xs text-[rgb(var(--color-heading))] focus:outline-none focus:border-brand-primary"></td>
          <td class="px-2 py-1.5"><input [(ngModel)]="f.meta_tasa_accidentalidad" type="number" step="0.1" class="w-20 px-2 py-1 bg-dark-primary border border-dark-border rounded text-xs text-[rgb(var(--color-heading))] focus:outline-none focus:border-brand-primary"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="flex justify-end">
    <button (click)="guardar()" [disabled]="guardando()"
            class="flex items-center gap-2 px-5 py-2 text-sm rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium transition disabled:opacity-50">
      <ion-spinner *ngIf="guardando()" name="crescent" class="w-4 h-4"></ion-spinner>
      <span>Guardar parámetros</span>
    </button>
  </div>
</div>
